name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Kidev.slnx
      - run: dotnet format Kidev.slnx --verify-no-changes --no-restore
      - run: dotnet build Kidev.slnx --configuration Release --no-restore
      - run: dotnet test Kidev.slnx --configuration Release --no-build
