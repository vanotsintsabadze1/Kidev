name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - run: dotnet restore Kidev.slnx
      - run: dotnet build Kidev.slnx --configuration Release --no-restore

      - uses: github/codeql-action/analyze@v4
